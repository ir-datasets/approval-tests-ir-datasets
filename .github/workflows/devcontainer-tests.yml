name: Dev Container Tests

on:
  push:
  pull_request:

jobs:
  test-devcontainer:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ir-datasets/approval-tests-ir-datasets:0.0.1-dev
      # Mount the runner's Docker socket and /tmp so that
      # PyTerrierIndexVerifier's "tira-cli run local" can start sibling
      # containers on the host with bind mounts that resolve correctly.
      options: -v /var/run/docker.sock:/var/run/docker.sock -v /tmp:/tmp
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install package (test dependencies are preinstalled in the image)
        run: python -m pip install --no-deps -e .

      - name: Run tests
        run: python -m pytest
