name: Dev Container Tests

on:
  push:
  pull_request:

jobs:
  test-devcontainer:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ir-datasets/approval-tests-ir-datasets:0.0.1-dev
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install package (test dependencies are preinstalled in the image)
        run: python -m pip install --no-deps -e .

      - name: Run tests
        run: python -m pytest
